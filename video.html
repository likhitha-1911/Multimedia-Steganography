{% extends 'base.html' %}
{% block content %}
<section class="container py-5">
    <h2 class="mb-4 text-center">🎥 Video Steganography</h2>

    <!-- Tabs for Encrypt and Decrypt -->
    <ul class="nav nav-tabs mb-4" id="videoTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="embed-tab" data-bs-toggle="tab" data-bs-target="#embed" type="button" role="tab">
                <i class="fas fa-lock"></i> Embed Message
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="extract-tab" data-bs-toggle="tab" data-bs-target="#extract" type="button" role="tab">
                <i class="fas fa-unlock"></i> Extract Message
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="keys-tab" data-bs-toggle="tab" data-bs-target="#keys" type="button" role="tab">
                <i class="fas fa-key"></i> Generate Keys
            </button>
        </li>
    </ul>

    <div class="tab-content" id="videoTabsContent">
        <!-- Embed Tab -->
        <div class="tab-pane fade show active" id="embed" role="tabpanel" aria-labelledby="embed-tab">
            <!-- [Previous embed form content remains the same] -->
        </div>

        <!-- Extract Tab -->
        <div class="tab-pane fade" id="extract" role="tabpanel" aria-labelledby="extract-tab">
            <!-- [Previous extract form content remains the same] -->
        </div>

        <!-- Key Generation Tab -->
        <div class="tab-pane fade" id="keys" role="tabpanel" aria-labelledby="keys-tab">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-key"></i> RSA Key Pair Generator</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('generate_keys') }}">
                        <div class="mb-3">
                            <label for="keySize" class="form-label">Key Size</label>
                            <select class="form-select" name="key_size" id="keySize">
                                <option value="1024">1024 bits (Testing)</option>
                                <option value="2048" selected>2048 bits (Recommended)</option>
                                <option value="4096">4096 bits (High Security)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-cogs"></i> Generate Key Pair
                        </button>
                    </form>

                    {% if keys_generated %}
                    <div class="mt-4">
                        <h5><i class="fas fa-check-circle text-success"></i> Key Pair Generated</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Public Key</label>
                            <textarea class="form-control" rows="4" readonly>{{ public_key }}</textarea>
                            <button class="btn btn-sm btn-outline-secondary mt-2" onclick="copyToClipboard('{{ public_key }}')">
                                <i class="fas fa-copy"></i> Copy Public Key
                            </button>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Private Key</label>
                            <textarea class="form-control" rows="6" readonly>{{ private_key }}</textarea>
                            <div class="alert alert-warning mt-2">
                                <i class="fas fa-exclamation-triangle"></i> Keep this private key secure!
                            </div>
                            <button class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('{{ private_key }}')">
                                <i class="fas fa-copy"></i> Copy Private Key
                            </button>
                            <button class="btn btn-sm btn-danger ms-2" onclick="downloadKey('private_key.pem', '{{ private_key }}')">
                                <i class="fas fa-download"></i> Download Private Key
                            </button>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Use the public key for encryption and the private key for decryption.
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // [Previous JavaScript remains the same]
    
    // New function for key download
    function downloadKey(filename, text) {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
</script>

<style>
    /* [Previous CSS remains the same] */
    .card {
        border: none;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
    .card-header {
        border-radius: 0.375rem 0.375rem 0 0 !important;
    }
</style>
{% endblock %}
